changelog: >
  2.0.0.0 (Jellyfin 12.1): First build for Jellyfin 12.1, with the same
  features and settings as 1.4.0.0. Use it together with the Cinema
  Project script 20.0, which runs on Jellyfin 10.10.7 and 12.1.
  1.4.0.0 (Jellyfin 10.10.7, targetAbi 10.10.7.0, net8.0): List settings
  (poster menu tabs, environment and Ambient effects) no longer double after
  a server restart, and deselected entries stay off. The Smart Launch
  checkboxes on the admin page now work like all the others. Quieter log.
  1.3.1.0: Restyled the admin page: separators between the tabs, grey
  "Restore defaults" buttons and a blue Save button. Visual only, no
  settings changed.
  1.3.0.0: Renamed the configuration XML to
  Jellyfin.Plugin.CinemaProject.xml and moved the code namespace to
  Jellyfin.Plugin.CinemaProject. When updating an existing install:
  stop Jellyfin, rename CinemaProjectLoader.xml in the plugin
  configurations folder to Jellyfin.Plugin.CinemaProject.xml, then
  start again.
  1.2.0.0: Added server-side persisted settings for Kiosk, Controls, Display,
  Room, and Backwall (59 fields), plus Misc's own two remaining fields. Moved
  the earlier standalone Smart Launch settings page into this same 7-tab
  structure. Added a Backup/restore via code feature to Misc. Posters (51
  fields) remains a placeholder for a later release.
  1.1.0.0: Added a real admin configuration page (Dashboard > Plugins >
  Cinema Project) with server-side persisted Smart Launch settings. Also
  includes the earlier fixes for File Transformation registration (typed
  payload deserialization) and script delivery (switched from
  raw.githubusercontent.com to jsDelivr to fix a MIME-type execution block).
