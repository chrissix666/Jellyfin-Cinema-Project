targetAbi: "12.1.0.0"
framework: "net10.0"
overview: "Watch and listen to the soul of a movie, a visualized experience you step into like a video game."
description: >
  Every movie already has a soul: most of it buried in a poster and
  thumbnail. Cinema Project builds a virtual room experience around that
  instead. Walk through it like a video game: poster art lining the walls,
  a fanart and video slideshow across the backwall, theme songs filling the
  room, trailers, theme videos, or the movie itself playing on the screen up
  front. None of it is new, it's what your library already had, finally
  given space to be experienced all together, visualized all at once. On
  top of that, Ambient Mode lets you create your own feature show, similar
  to a pre-roll.
category: "Experimental"
owner: "chrissix666"
artifacts:
