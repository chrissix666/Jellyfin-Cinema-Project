name: Build Jellyfin Cinema Loader Plugin

# Runs automatically on every push to main (builds for verification,
# without publishing anything) AND on every newly created Git tag of
# the form "v1.0.0" etc (builds AND attaches the finished .dll as a
# download to a GitHub Release -- that's the download link that later
# goes into the manifest.json).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {} # also allows manually triggering via the "Run workflow" button on GitHub

# The automatic GITHUB_TOKEN Actions uses is read-only by default --
# creating a Release and attaching a file to it needs write access to
# repository contents, which has to be requested explicitly like this,
# or the release step fails with "Resource not accessible by
# integration" even though the build itself succeeds fine.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build project
        run: dotnet build JellyfinCinemaLoader/JellyfinCinemaLoader.csproj --configuration Release --output ./build

      - name: Provide build result as download
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinCinemaLoader
          path: ./build/JellyfinCinemaLoader.dll

      - name: Zip finished plugin (only on a version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p ./release
          cp ./build/JellyfinCinemaLoader.dll ./release/
          cd ./release
          zip -r ../JellyfinCinemaLoader-${{ github.ref_name }}.zip .

      - name: Create GitHub Release with finished zip (only on a version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JellyfinCinemaLoader-${{ github.ref_name }}.zip
